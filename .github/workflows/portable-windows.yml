name: Portable Windows build

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A newer push to a pull request cancels its older run. Other events get a unique group, so no
# main commit's run (and its artifact) is cancelled or dropped from the queue.
concurrency:
  group: portable-windows-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  portable:
    name: Validate and package Windows x64
    runs-on: windows-2025
    # A slow runner took 43 minutes once the P2 oracles also ran under Electron's Node (run 39169401633).
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm from package.json
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Download the pinned Electron runtime
        run: node node_modules/electron/install.js

      # P2 vectors are written under Electron's Node and CI installs the same version, so an Electron upgrade moves the pin.
      - name: Check that .node-version is Electron's Node
        run: |
          $pinned = (Get-Content -LiteralPath .node-version -Raw).Trim()
          $shipped = node scripts/electron-node.mjs -p process.versions.node
          if ($LASTEXITCODE -ne 0) { throw 'Electron did not report its Node version.' }
          if ($shipped -cne $pinned) { throw "Electron ships Node $shipped but .node-version pins $pinned. Move the pin with Electron, then check every oracle with pnpm oracle." }
          if ((node -p process.versions.node) -cne $pinned) { throw "setup-node did not install the pinned Node $pinned." }

      - name: Configure isolated Git fixtures
        run: git config --global init.defaultBranch main

      - name: Run type checks, lint, and tests
        run: pnpm check --maxWorkers=1 --bail=1

      # Electron builds Node with its own V8 and ICU, so the P2 vectors are checked again on the runtime the app ships.
      - name: Check the P2 oracles under Electron's Node
        run: |
          pnpm oracle --maxWorkers=1 --bail=1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/electron-node.mjs tests/p2/git-metadata-oracle.mjs

      - name: Test Electron user workflows with offline fixtures
        id: e2e
        run: pnpm test:e2e

      # Traces, screenshots and the state files the specs write on failure; fixtures are offline and temporary.
      - name: Upload Electron test evidence
        if: failure() && steps.e2e.outcome == 'failure'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-test-results-${{ github.run_id }}-${{ github.run_attempt }}
          path: test-results/
          if-no-files-found: warn
          retention-days: 14

      - name: Build the portable executable
        run: pnpm package:portable

      - name: Smoke test the packaged runtime
        run: pnpm smoke:package

      - name: Smoke test the portable executable
        run: pnpm smoke:portable

      - name: Write portable executable checksum
        run: |
          $packages = @(Get-ChildItem -LiteralPath release -Filter 'Foundry-Agent-Workspace-Portable-*-x64.exe' -File)
          if ($packages.Count -ne 1) { throw "Expected one portable executable, found $($packages.Count)" }
          $package = $packages[0]
          $hash = (Get-FileHash -LiteralPath $package.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $($package.Name)" | Set-Content -LiteralPath "$($package.FullName).sha256" -Encoding ascii

      - name: Upload the portable app and checksum
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: foundry-portable-windows-x64-${{ github.sha }}
          path: |
            release/Foundry-Agent-Workspace-Portable-*-x64.exe
            release/Foundry-Agent-Workspace-Portable-*-x64.exe.sha256
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

name: .NET build

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dotnet-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dotnet:
    name: Build and test the .NET solution
    runs-on: windows-2025
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    env:
      DOTNET_NOLOGO: 'true'
      DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
      TESTINGPLATFORM_TELEMETRY_OPTOUT: 'true'

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up the SDK pinned by global.json
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      # The FinalPath tests compare with Node's realpath; Electron 44, which computed every persisted key, runs Node 24.
      - name: Set up pnpm from package.json
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up the Node.js oracle
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      # Playwright drives the WebView2 rig over CDP (spike S9's E2E skeleton); the Electron binary is not needed here.
      - name: Install locked Node dependencies
        run: pnpm install --frozen-lockfile
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'

      - name: Restore from lock files
        run: dotnet restore Foundry.slnx --locked-mode

      - name: Build with warnings as errors
        run: dotnet build Foundry.slnx --configuration Release --no-restore -warnaserror

      - name: Test
        run: dotnet test --solution Foundry.slnx --configuration Release --no-build

      # Temporary, removed before merge (as spike S10 did): proves Run-S6.ps1 publishes the toast spike, zips it and
      # compiles its per-user installer with the runner's Inno Setup. Nothing is installed or registered.
      - name: Build the S6 toast spike and its installer (temporary)
        run: powershell -NoProfile -ExecutionPolicy Bypass -File tests/Foundry.Spikes.Toast/Run-S6.ps1 -BuildOnly
